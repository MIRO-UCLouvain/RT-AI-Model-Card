services:

  # ── MySQL 8 ──────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    # Raise limits to handle large JSON content columns (embedded base64 images).
    # sort_buffer_size: per-session buffer for ORDER BY; default 256 KB is too
    #   small when rows contain multi-MB JSON.
    # max_allowed_packet: cap on a single query/result packet; 64 MB default is
    #   usually fine but raise it to 256 MB to be safe with large content saves.
    command: >
      --sort-buffer-size=32M
      --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h", "localhost",
          "-u", "${MYSQL_USER}",
          "--password=${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Hot-reload in development: mount source and enable --reload
    # volumes:
    #   - ./backend:/app
    # command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  mysql_data:

# Streamlit is intentionally NOT included here.
# Run it locally as usual: streamlit run app/cli.py
